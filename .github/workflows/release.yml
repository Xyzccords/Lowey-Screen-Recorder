name: Build and release installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Lowey Screen Recorder)
        run: npm ci

      - name: Build and publish installer (Lowey Screen Recorder)
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (Lowey Quick Recorder)
        run: npm ci
        working-directory: quick-recorder

      - name: Build and publish installer (Lowey Quick Recorder)
        run: npx electron-builder --publish always
        working-directory: quick-recorder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
